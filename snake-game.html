<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #e94560;
      letter-spacing: 4px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      max-width: 400px;
      margin: 0 auto 12px;
      font-size: 1rem;
    }

    .info span {
      background: #16213e;
      padding: 6px 16px;
      border-radius: 8px;
    }

    .info span em {
      font-style: normal;
      color: #e94560;
      font-weight: bold;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border: 2px solid #0f3460;
      border-radius: 8px;
      background: #16213e;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .overlay.active {
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #e94560;
    }

    .overlay p {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 16px;
    }

    .overlay button {
      padding: 10px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .overlay button:hover {
      background: #c73650;
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 贪吃蛇</h1>
    <div class="info">
      <span>得分：<em id="score">0</em></span>
      <span>最高分：<em id="best">0</em></span>
    </div>
    <div style="position:relative; display:inline-block;">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay active" id="overlay">
        <h2 id="overlayTitle">贪吃蛇</h2>
        <p id="overlayMsg">按下按钮或空格开始</p>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="controls-hint">方向键 / WASD 控制方向 · 空格暂停</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMsg = document.getElementById('overlayMsg');
    const startBtn = document.getElementById('startBtn');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, best, running, paused, loopId;

    // 初始化最高分
    best = parseInt(localStorage.getItem('snake_best') || '0');
    bestEl.textContent = best;

    function init() {
      const midX = Math.floor(COLS / 2);
      const midY = Math.floor(ROWS / 2);
      snake = [
        { x: midX, y: midY },
        { x: midX - 1, y: midY },
        { x: midX - 2, y: midY },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function draw() {
      // 背景
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格线
      ctx.strokeStyle = '#1a2744';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * GRID);
        ctx.lineTo(canvas.width, j * GRID);
        ctx.stroke();
      }

      // 食物
      ctx.fillStyle = '#e94560';
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 蛇
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length * 0.5;
        const r = Math.round(69 * ratio);
        const g = Math.round(255 * ratio);
        const b = Math.round(120 * ratio);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, 4);
        ctx.fill();
      });
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙检测
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }

      // 撞自己检测
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // 吃食物
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      running = false;
      clearInterval(loopId);

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake_best', best);
      }

      overlayTitle.textContent = '游戏结束';
      overlayMsg.textContent = `最终得分：${score}`;
      startBtn.textContent = '再来一局';
      overlay.classList.add('active');
    }

    function start() {
      init();
      overlay.classList.remove('active');
      running = true;
      paused = false;
      clearInterval(loopId);
      loopId = setInterval(() => {
        if (!paused) {
          update();
          draw();
        }
      }, 120);
      draw();
    }

    // 按键控制
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!running) {
          start();
        } else {
          paused = !paused;
          if (paused) {
            overlayTitle.textContent = '暂停中';
            overlayMsg.textContent = '按空格继续';
            overlay.classList.add('active');
          } else {
            overlay.classList.remove('active');
          }
        }
        return;
      }

      const keyMap = {
        ArrowUp:    { x:  0, y: -1 },
        ArrowDown:  { x:  0, y:  1 },
        ArrowLeft:  { x: -1, y:  0 },
        ArrowRight: { x:  1, y:  0 },
        KeyW:       { x:  0, y: -1 },
        KeyS:       { x:  0, y:  1 },
        KeyA:       { x: -1, y:  0 },
        KeyD:       { x:  1, y:  0 },
      };

      const newDir = keyMap[e.code];
      if (newDir && !(newDir.x === -dir.x && newDir.y === -dir.y)) {
        nextDir = newDir;
      }
    });

    // 触摸控制
    let touchStart = null;
    canvas.addEventListener('touchstart', (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

      let newDir;
      if (Math.abs(dx) > Math.abs(dy)) {
        newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
      } else {
        newDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
      }
      if (!(newDir.x === -dir.x && newDir.y === -dir.y)) {
        nextDir = newDir;
      }
      touchStart = null;
    });

    // 按钮点击
    startBtn.addEventListener('click', start);

    // 初始绘制
    init();
    draw();
  </script>
</body>
</html>
